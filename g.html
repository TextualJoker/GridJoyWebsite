    <!-- Google Analytics 4 (gtag.js) — measurementId G-ZD2GJG5JS9.
         Linked to the gridjoy-7548a Firebase project so events stream into
         both GA4 and Firebase Analytics. The web app emits events via
         src/services/analytics.ts → window.gtag('event', name, params).

         PRODUCTION HOST ONLY (2026-07-20). This used to load unconditionally,
         so every `npm run dev` / `vite preview` / LAN-IP session streamed into
         the live property: 58 sessions and 36 phantom "users" over the 90 days
         to 2026-07-20 — ~6% of all web sessions, inflating the exact numbers
         growth decisions are steered by. gridjoy.app is the only host that
         serves this app (public/CNAME; www 301s to the apex; GA4's hostname
         report has never seen another). A staging host must NOT be added here
         without its own measurement ID, or the pollution comes straight back.

         Safe to gate: analytics.ts's forwarder checks for window.gtag and
         falls back to a DEV console line, so no call site changes behaviour.

         ?dev EXCLUDED TOO (2026-08-01). The hostname gate closed the local
         leak but not the one on the live host: `?dev` unlocks the design-lab /
         ghost-catalogue routes that App.tsx deliberately keeps off the public
         surface, so it is only ever us. GA4 recorded 83 sessions landing on
         `/?dev=` in the 90 days to 2026-08-01 from 3 "new users" — ~9% of web
         sessions, a bigger leak than the localhost one this block was written
         for. Gating at load excludes the whole session, which is what we want:
         a dev-mode visit is internal from its first pageview to its last.

         BROWSER AUTOMATION EXCLUDED TOO (2026-09-03), and this one dwarfed
         both. Our own Playwright sweeps run against the DEPLOYED origin —
         site-a11y.spec.ts and no-page-errors.spec.ts, both driven off
         ROUTE_MANIFEST — so they are gridjoy.app, they carry no ?dev, and they
         walked straight through the two gates above. Measured, not inferred:
         a probe run of our real harness against gridjoy.app/faq reported
         `navigator.webdriver: true`, viewport 1280x720, a Windows Chrome UA,
         and `typeof window.gtag === "function"` — gtag loaded, on our own
         traffic.

         What it did to the numbers, GA4 web stream, 30 days to 2026-09-02:
         Direct sessions ran 2-5 a DAY through August, then 476 on 08-31, 412
         on 09-01, 231 on 09-02 — the days no-page-errors.spec.ts was written
         and then widened from ten hand-picked paths to all 74 routes. Direct
         finished at 1298 of 1952 web sessions (66%), 99.6% of them "new", mean
         session 5.2s against 58.6s for Organic Search, and 1024 of them at
         exactly 1280x720. Every landing-page conversion RATE divides by that.

         `navigator.webdriver` is the signal because it is the one the browser
         sets for us: true under Playwright, Puppeteer and Selenium, headed or
         headless, and false in a real Chrome. It is not a UA sniff, so it does
         not decay with the next Chromium bump — and the harness's UA says
         "Windows NT 10.0" on a Linux Pi, which is exactly how a UA sniff would
         have got this wrong.

         The Android app stream is untouched: ga4-new-users.mjs filters to
         platform=Android, so the ~400-new-players-a-month North Star never
         included any of this. -->
    <script>
      (function () {
        var h = window.location.hostname;
        if (h !== "gridjoy.app" && h !== "www.gridjoy.app") return;
        if (new URLSearchParams(window.location.search).has("dev")) return;
        if (navigator.webdriver) return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", "G-ZD2GJG5JS9");
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-ZD2GJG5JS9";
        document.head.appendChild(s);
      })();
    </script>

    <!-- Google Fonts — preconnect before the font stylesheet so DNS+TCP+TLS
         for both domains begins as soon as the HTML is parsed, before CSS
         is downloaded. Without this, font discovery is deferred until the
         browser downloads + parses the CSS bundle (~500-1000ms penalty on
         slow mobile).
         The stylesheet is loaded non-blocking (media="print" trick) so it
         never delays first paint / LCP. The browser downloads it in the
         background; onload flips media to "all" so the font applies without
         a repaint penalty. display=swap in the URL means the fallback system
         font renders immediately while Outfit is fetched (FOUT is acceptable
         and expected). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=League+Spartan:wght@800&family=JetBrains+Mono:wght@500;700&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
